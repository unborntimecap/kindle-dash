name: render
# Renders the Kindle dashboard PNGs every 30 min and force-pushes them to the orphan branch `render`.
# The Kindle fetches https://raw.githubusercontent.com/unborntimecap/kindle-dash/render/<page>.png
on:
  schedule:
    - cron: "*/30 * * * *"   # UTC; GitHub may delay by several minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render/**, kids.json, priorities.md, hide.txt, rerender.txt, .github/workflows/render.yml]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt

      - name: Restore source cache (last good copies of feeds, used if a source is down)
        uses: actions/cache/restore@v4
        with:
          path: render/cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Install
        run: |
          pip install -q -r render/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render
        working-directory: render
        env:
          ICS_ADHOC: ${{ secrets.ICS_ADHOC }}
          ICS_WORK: ${{ secrets.ICS_WORK }}
          ICS_HOSPORTAL: ${{ secrets.ICS_HOSPORTAL }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python render.py

      - name: Save source cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: render/cache
          key: sources-${{ github.run_id }}

      - name: Publish to branch `render` (single commit, history discarded each run)
        working-directory: render/out
        run: |
          git init -q
          git checkout -q -b render
          git add *.png
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com \
            commit -q -m "render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" render
